name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # The build reads MongoDB, and CI has no cluster credentials. This checks
      # the committed fallback instead — the thing that keeps a deploy alive
      # when Atlas is unreachable. See src/lib/build-guard.ts.
      - name: Content snapshot is present and fresh
        run: node scripts/snapshot-content.mjs --check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
